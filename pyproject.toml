[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodiff-engine"
version = "0.1.0"
description = "A small reverse-mode automatic differentiation engine for scalar computation graphs."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "x0z"}
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


